<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: 1.2em / 1.5 system-ui;
            margin: 0 auto;
            width: 500px;
        }

        fieldset {
            border: 0;
        }

        fieldset,
        legend {
            padding: 0;
            margin: 0;
        }

        input[type="text"] {
            margin-top: 5px;
            padding: 5px;
            width: 50%;
            display: block;
        }

        div,
        fieldset {
            margin-top: 20px;
        }

        p {
            margin-top: 10px;
            background: #ffc125;
            padding: 20px;
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div>
        <label for="custom-name">Enter custom name:</label>
        <input id="custom-name" type="text" placeholder="John" />
    </div>
    <fieldset>
        <legend>Choose locale:</legend>
        <label for="us">US</label><input id="us" type="radio" name="uk-us" value="us" checked />
        <label for="uk">UK</label><input id="uk" type="radio" name="uk-us" value="uk" />
    </fieldset>
    <div>
        <button class="generate">Generate random story</button>
    </div>
    <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
    <p class="story"></p>

    <script>
        // Complete variable definitions and random functions

        const customName = document.getElementById("custom-name");
        const generateBtn = document.querySelector(".generate");
        const story = document.querySelector(".story");

        function randomValueFromArray(array) {
            const random = Math.floor(Math.random() * array.length);
            return array[random];
        }

        // Raw text strings

        // Willy the Goblin
        // Big Daddy
        // Father Christmas

        // the soup kitchen
        // Disneyland
        // the White House

        // spontaneously combusted
        // melted into a puddle on the sidewalk
        // turned into a slug and slithered away

        // Partial return random string function

        const insertX = [
            "Willy the Goblin",
            "Big Daddy",
            "Father Christmas"
        ];

        const insertY = [
            "the soup kitchen",
            "Disneyland",
            "the White House"
        ];

        const insertZ = [
            "spontaneously combusted",
            "melted into a puddle on the sidewalk",
            "turned into a slug and slithered away"
        ];

        const storyText = "It was 94 Fahrenheit outside, so :insertx: went for a walk. When they got to :inserty:, they stared in horror for a few moments, then :insertz:. Bob saw the whole thing, but was not surprised — :insertx: weighs 300 pounds, and it was a hot day.";

        // Event listener and partial generate function definition

        generateBtn.addEventListener("click", generateStory);

        function generateStory() {

            const xItem = randomValueFromArray(insertX);
            const yItem = randomValueFromArray(insertY);
            const zItem = randomValueFromArray(insertZ);

            let newStory = storyText;

            newStory = newStory.replaceAll(":insertx:", xItem);
            newStory = newStory.replaceAll(":inserty:", yItem);
            newStory = newStory.replaceAll(":insertz:", zItem);

            if (customName.value !== "") {
                const name = customName.value;

                newStory = newStory.replace("Bob", name);
            }

            if (document.getElementById("uk").checked) {
                const weight = Math.round(300);
                const temperature = Math.round(94);

                newStory = newStory.replace("300 pounds", weight);
                newStory = newStory.replace("94 Fahrenheit", temperature);
            }

            // TODO: replace "" with the correct expression
            story.textContent = newStory;
            story.style.visibility = "visible";
        }

    </script>

</body>

</html>
